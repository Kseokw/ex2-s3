# 워크플로우(작업) 이름
name: GitOps S3 CICD Pipeline

# 1. 트리거 설정: 브랜치 정의
on:
  push:
    branches:
      - main

jobs:
  build-and-update:
    runs-on: ubuntu-latest # 실제 작업 주체
    
    # 작업 절차
    steps:
    # - name: <작업명>
    #   uses: <작업종류 - 라이브러리 버전>
    #   with: 
    #     <ACCESS key 등>
    #   env: 
    #     <환경변수>
    #   run: |
    #     <리눅스 명령들>

    # 1. 파일 전송 전에 EC2에 SSH로 접속하여 권한을 먼저 변경합니다.
    # - name: 웹 서버 폴더 권한 변경
    #   uses: appleboy/ssh-action@master
    #   with:
    #     host: ${{secrets.EC2_HOST}}
    #     username: ${{secrets.EC2_USER}}
    #     key: ${{secrets.EC2_SSH_KEY}}
    #     port: 22
    #     script: |
    #       sudo chown -R ${{secrets.EC2_USER}}:${{secrets.EC2_USER}} /var/www/html

    - name: 소스코드 전송
      uses: actions/checkout@v4

    - name: S3 정적웹사이트로 배포
      uses: appleboy/scp-action@master
      with:
        host: ${{secrets.EC2_HOST}}
        username: ${{secrets.EC2_USER}}
        key: ${{secrets.EC2_SSH_KEY}}
        port: 22
        source: "html/*"
        target: "/var/www/html"
        strip_components: 1

